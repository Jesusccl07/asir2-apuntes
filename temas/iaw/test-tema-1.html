<style>

/* ---------- confeti ---------- */
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=0;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function fitCanvas(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
fitCanvas();addEventListener("resize",fitCanvas);
function burst(x,y,n=40,spread=1){
  if(reduce)return;
  const cols=["#ff4f9a","#ffd447","#3fd6ff","#3ee08f","#f5f0ff"],d=devicePixelRatio;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(3+Math.random()*6)*spread;
    parts.push({x:x*d,y:y*d,vx:Math.cos(a)*v*d,vy:(Math.sin(a)*v-5)*d,r:(3+Math.random()*4)*d,c:cols[i%cols.length],l:60+Math.random()*40,rot:Math.random()*6})}
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.l-->0);
  for(const p of parts){p.vy+=.35*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.rot+=.2;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.globalAlpha=Math.min(1,p.l/30);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()}
  raf=parts.length?requestAnimationFrame(tick):0;
}
const rainConfetti=()=>{for(let i=0;i<6;i++)setTimeout(()=>burst(Math.random()*innerWidth,innerHeight*.25,45,1.3),i*140)};

const big=$("big");
big.onclick=e=>{big.classList.remove("boing");void big.offsetWidth;big.classList.add("boing");burst(e.clientX,e.clientY,60,1.2)};

/* ---------- partida ---------- */
let S;
function start(m){
  let qs,title;
  if(m==="final"){qs=shuffle([...shuffle(ALL.filter(HOT)).slice(0,12),...shuffle(ALL.filter(q=>!HOT(q))).slice(0,8)]);title="Examen final"}
  else if(m==="profe"){qs=shuffle(ALL.filter(HOT)).slice(0,15);title="Modo profe"}
  else if(m==="crono"||m==="vidas"||m==="todo"){qs=shuffle(ALL);title={crono:"Contrarreloj",vidas:"Supervivencia",todo:"Todo el tema"}[m]}
  else if(m==="fallos"){qs=shuffle(ALL.filter(q=>wrongs.has(q.key)));title="Repaso de fallos"}
  else{const b=B.find(x=>x.id===m);qs=shuffle(b.q.map(q=>({...toQ(q),blk:b.id})));title=b.t}
  S={m,title,qs,i:0,ok:0,missed:[],answered:false,pts:0,streak:0,maxStreak:0,lives:3,time:90,timer:null,done:false};
  $("pbar").classList.toggle("time",m==="crono");
  show("quiz");render();
  if(m==="crono")S.timer=setInterval(()=>{S.time--;hud();if(S.time<=0)finish()},1000);
}
function hud(pop){
  let h=`<span class="chip">⭐ <b id="hp">${S.pts}</b></span><span class="chip streak">🔥 <b id="hs">${S.streak}</b>${S.streak>=3?" ×"+mult().toFixed(1):""}</span>`;
  if(S.m==="vidas")h+=`<span class="chip">${"❤️".repeat(S.lives)}${"🖤".repeat(3-S.lives)}</span>`;
  if(S.m==="crono")h+=`<span class="chip">⏱ <b>${Math.max(0,S.time)} s</b></span>`;
  $("hud").innerHTML=h;
  if(pop&&$(pop))$(pop).classList.add("pop");
  if(S.m==="crono"){$("prog").style.width=Math.max(0,Math.min(100,S.time/90*100))+"%";$("pbar").classList.toggle("low",S.time<=15)}
  else $("prog").style.width=(S.i/S.qs.length*100)+"%";
}
const mult=()=>1+Math.min(S.streak,10)*.2;
function render(){
  if(S.i>=S.qs.length){if(S.m==="crono"||S.m==="vidas"){S.qs=S.qs.concat(shuffle(ALL))}else return finish()}
  const q=S.qs[S.i];S.answered=false;
  $("qtitle").textContent=S.title;
  $("qcount").textContent=(S.m==="crono"||S.m==="vidas")?`#${S.i+1}`:`${S.i+1}/${S.qs.length}`;
  hud();
  $("qcard").classList.remove("shake");
  $("qtext").innerHTML=(q.p?'<span class="badge">Del profe</span>':"")+esc(q.q);
  if(q.type==="w"){
    S.opts=[];
    $("opts").innerHTML=`<form class="write" id="wf"><input id="win" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe la respuesta"><button class="btn" type="submit">Comprobar</button></form>`;
    $("wf").onsubmit=e=>{e.preventDefault();if($("win").value.trim())answer(-1,$("win"))};
    setTimeout(()=>$("win")&&$("win").focus(),0);
  }else{
    S.opts=q.type==="vf"?["Verdadero","Falso"]:shuffle([q.a,...q.w]);
    $("opts").innerHTML=S.opts.map((o,i)=>`<button class="opt" id="opt${i}" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join("");
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i,b));
  }
  $("fb").hidden=true;$("next").hidden=true;
}
function answer(i,el){
  if(S.answered||S.done)return;S.answered=true;
  const q=S.qs[S.i];let right;
  if(q.type==="w"){
    const inp=$("win");right=q.acc.some(a=>norm(a)===norm(inp.value));
    inp.disabled=true;inp.classList.add(right?"ok":"bad");$("wf").querySelector("button").hidden=true;
  }else{
    right=S.opts[i]===q.a;
    document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(S.opts[j]===q.a)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
  }
  let gained=0;
  if(right){
    S.ok++;S.streak++;S.maxStreak=Math.max(S.maxStreak,S.streak);
    gained=Math.round(100*mult());S.pts+=gained;
    if(S.m==="crono")S.time+=3;
    if(S.m==="fallos")wrongs.delete(q.key);
    const r=(el||$("qtext")).getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,S.streak%5===0?90:28,S.streak%5===0?1.4:.8);
  }else{
    S.streak=0;S.missed.push(q);wrongs.add(q.key);
    if(S.m==="crono")S.time-=5;
    if(S.m==="vidas")S.lives--;
    void $("qcard").offsetWidth;$("qcard").classList.add("shake");
  }
  store.set("iaw1-wrong",[...wrongs]);
  hud(right?"hp":null);
  $("fb").innerHTML=`<span class="code ${right?"ok":"bad"}">${right?"200 OK":"404"}</span>${right?"":"Era: <b>"+esc(q.a)+"</b>. "}${esc(q.e)}${gained?`<span class="plus">+${gained}</span>`:""}${right&&S.streak>=3&&S.streak%5===0?` <b>¡Racha de ${S.streak}! 🔥</b>`:""}`;
  $("fb").hidden=false;
  const over=(S.m==="vidas"&&S.lives<=0)||(S.m==="crono"&&S.time<=0);
  if(S.m==="crono"&&!over){setTimeout(()=>{if(!S.done&&S.answered){S.i++;render()}},right?650:1600);return}
  $("next").textContent=over||(S.i+1>=S.qs.length&&S.m!=="vidas")?"Ver resultado":"Siguiente";
  $("next").hidden=false;$("next").focus();
}
$("next").onclick=()=>{if((S.m==="vidas"&&S.lives<=0)){finish();return}S.i++;render()};
$("back").onclick=menu;
function finish(){
  if(S.done)return;S.done=true;clearInterval(S.timer);
  const game=S.m==="crono"||S.m==="vidas";
  const n=game?S.ok+S.missed.length:S.qs.length,grade=n?S.ok/n*10:0,pass=game?S.pts>0:grade>=5;
  let record=false;
  if(game){if(best[S.m]==null||S.pts>best[S.m]){best[S.m]=S.pts;record=S.pts>0}}
  else if(S.m!=="fallos"&&(best[S.m]==null||grade>best[S.m])){best[S.m]=grade;record=true}
  store.set("iaw1-best",best);
  stats.pts+=S.pts;stats.played++;stats.streak=Math.max(stats.streak,S.maxStreak);saveStats();
  const msg=game?(record?"¡Nuevo récord!":"Partida terminada"):(grade>=9?"Tema dominado.":grade>=7?"Muy bien, repasa los fallos.":pass?"Aprobado justo, dale otra vuelta.":"Toca repasar.");
  $("result").innerHTML=`<div class="sub">${esc(S.title).toUpperCase()}</div>
  <div class="status ${pass?"ok":"bad"}" style="margin-top:12px">${game?S.pts.toLocaleString("es")+" pts":pass?"200 OK":"500 Error"}</div>
  <p class="score">${game?`${S.ok} aciertos de ${n}`:`<b>${grade.toFixed(1)}</b> / 10 · ${S.ok} de ${n} aciertos`}</p>
  <p style="color:var(--muted);margin:0">${msg}</p>
  <div class="rankres" id="rankres"></div>
  <div class="stats"><span class="chip">⭐ <b>${S.pts}</b> puntos</span><span class="chip">Mejor racha <b>🔥 ${S.maxStreak}</b></span></div>
  <div class="actions"><button class="btn" id="again">Otra vez</button>${S.missed.length?'<button class="btn ghost" id="rf">Repasar fallos</button>':""}<button class="btn ghost" id="home">Menú</button></div>
  ${S.missed.length?`<h2>Tus fallos</h2><div class="review">${S.missed.map(q=>`<div class="it"><b>${esc(q.q)}</b><span class="ans">${esc(q.a)}</span> · ${esc(q.e)}</div>`).join("")}</div>`:""}`;
  show("result");
  submitScore();
  if(pass&&(record||grade>=7))rainConfetti();
  $("again").onclick=()=>start(S.m);$("home").onclick=menu;
  if($("rf"))$("rf").onclick=()=>start("fallos");
}
document.addEventListener("keydown",e=>{
  if($("quiz").hidden||!S||S.answered)return;
  if(e.target.tagName==="INPUT")return;
  if(e.key>="1"&&e.key<="4"){const i=+e.key-1;if(i<S.opts.length)answer(i,$("opt"+i))}
});
/* ---------- ranking compartido ---------- */
const RT=[["total","Puntos totales",v=>v.toLocaleString("es")+" pts"],["crono","Contrarreloj",v=>v.toLocaleString("es")+" pts"],["vidas","Supervivencia",v=>v.toLocaleString("es")+" pts"],["final","Examen final",v=>v.toFixed(1)+" / 10"],["streak","Mejor racha",v=>"🔥 "+v]];
let rtab=store.get("iaw1-rtab","total"),rdocs=[],myId=null,myDoc=null,db=null,usr=null,canWrite=true,lastPos=null;
function rankTabs(){
  $("tabs").innerHTML=RT.map(([k,l])=>`<button class="tab" data-k="${k}" aria-pressed="${k===rtab}">${l}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{rtab=b.dataset.k;store.set("iaw1-rtab",rtab);rankTabs();renderRank()});
}
function sorted(k){return rdocs.filter(d=>typeof d[k]==="number"&&d[k]>0).sort((a,b)=>b[k]-a[k]||(a.at||"").localeCompare(b.at||""))}
async function renderRank(flashId){
  const [k,,fmt]=RT.find(t=>t[0]===rtab);
  const list=sorted(k).slice(0,15);
  $("rcount").textContent=rdocs.length+(rdocs.length===1?" jugador":" jugadores");
  if(!list.length){$("rows").innerHTML=`<div class="empty">${db?"Nadie ha puntuado aquí todavía. Juega una partida y estrena el ranking.":"El ranking se ve al abrir la web con tu cuenta de claude.ai."}</div>`;return}
  let names={};
  if(usr){try{names=await usr.profiles(list.map(d=>d.id))}catch(e){}}
  $("rows").innerHTML=list.map((d,i)=>{const nm=d.nick||(names[d.id]&&names[d.id].name)||"Anónimo";
    return `<div class="row ${i<3?"p"+(i+1):""} ${d.id===myId?"me":""} ${d.id===flashId?"flash":""}"><span class="pos">${["🥇","🥈","🥉"][i]||i+1}</span><span class="nm"></span><span class="val">${fmt(d[k])}</span></div>`}).join("");
  [...$("rows").querySelectorAll(".nm")].forEach((el,i)=>{const d=list[i];el.textContent=d.nick||(names[d.id]&&names[d.id].name)||"Anónimo";if(d.id===myId){const sm=document.createElement("small");sm.textContent="tú";el.appendChild(sm)}});
  meLine();
}
function myPos(k){const i=sorted(k).findIndex(d=>d.id===myId);return i<0?null:i+1}
function meLine(){
  if(!db){$("meline").textContent="";return}
  if(!canWrite){$("meline").textContent="Con este acceso puedes ver el ranking pero no salir en él.";return}
  const p=myPos(rtab);
  $("meline").innerHTML=myDoc?(p?`Vas <b>${p}º</b> en esta categoría.`:"Aún no tienes puntuación en esta categoría."):"Pon tu nombre y juega para aparecer.";
}
async function initRank(){
  rankTabs();
  try{db=await claude.use("db");usr=await claude.use("user")}catch(e){}
  if(!db){$("rcount").textContent="Sin conexión";$("nickf").hidden=true;renderRank();return}
  try{myId=usr?await usr.id():null}catch(e){}
  try{const w=usr&&await usr.can("data.write");if(w===false)canWrite=false}catch(e){}
  if(!myId)canWrite=false;
  $("nickf").hidden=!canWrite;
  db.collection("ranking").onSnapshot(snap=>{
    rdocs=snap.docs.map(d=>({id:d.id,...d.data()}));
    myDoc=rdocs.find(d=>d.id===myId)||null;
    if(myDoc&&myDoc.nick&&document.activeElement!==$("nick"))$("nick").value=myDoc.nick;
    renderRank();
  },()=>{$("rcount").textContent="Sin conexión"});
}
let writing=Promise.resolve();
function saveMine(patch){
  if(!db||!myId||!canWrite)return Promise.resolve(false);
  writing=writing.then(async()=>{
    const cur=myDoc||{};
    const next={nick:cur.nick||"",total:cur.total||0,crono:cur.crono||0,vidas:cur.vidas||0,final:cur.final||0,streak:cur.streak||0,games:cur.games||0,...patch(cur),at:new Date().toISOString()};
    try{await db.collection("ranking").doc(myId).set(next);myDoc={id:myId,...next};return true}catch(e){return false}
  });
  return writing;
}
$("nickf").onsubmit=e=>{e.preventDefault();const v=$("nick").value.trim().slice(0,20);if(!v)return;
  store.set("iaw1-nick",v);saveMine(()=>({nick:v})).then(ok=>{$("meline").textContent=ok?"Nombre guardado.":"No se pudo guardar el nombre. Prueba otra vez."})};
try{const n=store.get("iaw1-nick","");if(n)$("nick").value=n}catch(e){}
async function submitScore(){
  const game=S.m==="crono"||S.m==="vidas";
  const n=S.ok+S.missed.length,grade=S.qs.length?S.ok/(game?Math.max(n,1):S.qs.length)*10:0;
  const nick=($("nick").value||store.get("iaw1-nick","")).trim().slice(0,20);
  const before=myPos(game?S.m:S.m==="final"?"final":"total");
  const ok=await saveMine(c=>{const o={total:(c.total||0)+S.pts,games:(c.games||0)+1,streak:Math.max(c.streak||0,S.maxStreak)};
    if(nick&&!c.nick)o.nick=nick;
    if(S.m==="crono")o.crono=Math.max(c.crono||0,S.pts);
    if(S.m==="vidas")o.vidas=Math.max(c.vidas||0,S.pts);
    if(S.m==="final")o.final=Math.max(c.final||0,Math.round(grade*10)/10);
    return o});
  const el=$("rankres");if(!el)return;
  if(!db){el.textContent="";return}
  if(!ok){el.textContent=canWrite?"No se pudo subir la puntuación al ranking.":"";return}
  setTimeout(()=>{const k=game?S.m:S.m==="final"?"final":"total",p=myPos(k),lbl=RT.find(t=>t[0]===k)[1];
    if(el.isConnected)el.textContent=p?`🏆 Ranking · ${lbl}: vas ${p}º de ${sorted(k).length}${before&&p<before?" (subes "+(before-p)+")":""}`:"Puntuación subida al ranking.";},700);
}
initRank();
menu();
</script>
